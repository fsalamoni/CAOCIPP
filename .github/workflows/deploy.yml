name: Deploy to Firebase

# Deploy automático para o Firebase a cada push no `main` (após um merge) e
# também sob demanda (workflow_dispatch).
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   Autenticação (um dos dois):
#     - FIREBASE_SERVICE_ACCOUNT  → JSON de uma conta de serviço com permissão de
#                                   deploy (Firebase Admin + Cloud Functions Admin
#                                   + Service Account User). Recomendado.
#     - FIREBASE_TOKEN            → token gerado por `firebase login:ci`.
#   Configuração do frontend (sem elas o app publicado não conecta ao Firebase):
#     - VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#       VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID,
#       VITE_FIREBASE_APP_ID
#     - (opcionais) VITE_CONSULTAS_CAO_APP_ID, VITE_CONSULTAS_CAO_FUNCTIONS_VERSION,
#       VITE_CONSULTAS_CAO_APP_BASE_URL
#   Configuração das Cloud Functions (opcionais — sem eles as respectivas
#   funcionalidades ficam graciosamente inativas, nada quebra):
#     - EMAIL_API_KEY        → chave da API do Resend (e-mail transacional: 2FA,
#                               resumo diário e relatório semanal por e-mail).
#     - PLATFORM_ADMIN_EMAILS → e-mails (separados por vírgula) com acesso de
#                               super-admin garantido, mesmo sem registro no Firestore.
#     - BILLING_BQ_PROJECT, BILLING_BQ_DATASET, BILLING_BQ_TABLE → export do
#                               Cloud Billing para o BigQuery (custos reais na aba Admin).
#   Passo a passo completo de cada um: app → Administração & Custos → aba Configuração.
#
# Enquanto os secrets de deploy não existirem, o job termina VERDE sem publicar
# nada (passo "Check deploy secrets"), evitando publicar um app quebrado.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check deploy secrets
        id: pre
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          if { [ -n "$SA" ] || [ -n "$TOKEN" ]; } && [ -n "$API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Secrets de deploy presentes — prosseguindo."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy pulado::Configure FIREBASE_SERVICE_ACCOUNT (ou FIREBASE_TOKEN) e as variáveis VITE_FIREBASE_* nos secrets do repositório para habilitar o deploy automático."
          fi

      - name: Setup Node.js
        if: steps.pre.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions-v2/package-lock.json

      - name: Install frontend dependencies
        if: steps.pre.outputs.ready == 'true'
        run: npm ci

      - name: Install functions dependencies
        if: steps.pre.outputs.ready == 'true'
        run: npm --prefix functions-v2 ci

      - name: Build functions
        if: steps.pre.outputs.ready == 'true'
        run: npm --prefix functions-v2 run build:local

      - name: Build frontend
        if: steps.pre.outputs.ready == 'true'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_CONSULTAS_CAO_APP_ID: ${{ secrets.VITE_CONSULTAS_CAO_APP_ID }}
          VITE_CONSULTAS_CAO_FUNCTIONS_VERSION: ${{ secrets.VITE_CONSULTAS_CAO_FUNCTIONS_VERSION }}
          VITE_CONSULTAS_CAO_APP_BASE_URL: ${{ secrets.VITE_CONSULTAS_CAO_APP_BASE_URL }}

      - name: Authenticate (service account)
        if: steps.pre.outputs.ready == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then
            printf '%s' "$SA" > "${RUNNER_TEMP}/firebase-sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/firebase-sa.json" >> "$GITHUB_ENV"
            echo "Autenticando via conta de serviço."
          else
            echo "Sem conta de serviço; usando FIREBASE_TOKEN."
          fi

      - name: Write functions runtime config (.env)
        if: steps.pre.outputs.ready == 'true'
        env:
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          PLATFORM_ADMIN_EMAILS: ${{ secrets.PLATFORM_ADMIN_EMAILS }}
          BILLING_BQ_PROJECT: ${{ secrets.BILLING_BQ_PROJECT }}
          BILLING_BQ_DATASET: ${{ secrets.BILLING_BQ_DATASET }}
          BILLING_BQ_TABLE: ${{ secrets.BILLING_BQ_TABLE }}
        run: |
          # functions-v2/.env é git-ignorado — nunca commitado. Cada secret
          # opcional configurado no GitHub vira uma variável de ambiente da
          # Cloud Function neste deploy; os que não existirem simplesmente
          # não entram no arquivo (a função correspondente já lida bem com a
          # ausência). Ver instruções completas em Admin → Configuração.
          ENV_FILE="functions-v2/.env"
          : > "$ENV_FILE"
          [ -n "$EMAIL_API_KEY" ] && printf 'EMAIL_API_KEY=%s\n' "$EMAIL_API_KEY" >> "$ENV_FILE"
          [ -n "$PLATFORM_ADMIN_EMAILS" ] && printf 'PLATFORM_ADMIN_EMAILS=%s\n' "$PLATFORM_ADMIN_EMAILS" >> "$ENV_FILE"
          [ -n "$BILLING_BQ_PROJECT" ] && printf 'BILLING_BQ_PROJECT=%s\n' "$BILLING_BQ_PROJECT" >> "$ENV_FILE"
          [ -n "$BILLING_BQ_DATASET" ] && printf 'BILLING_BQ_DATASET=%s\n' "$BILLING_BQ_DATASET" >> "$ENV_FILE"
          [ -n "$BILLING_BQ_TABLE" ] && printf 'BILLING_BQ_TABLE=%s\n' "$BILLING_BQ_TABLE" >> "$ENV_FILE"
          echo "$(wc -l < "$ENV_FILE") variável(is) de ambiente escrita(s) em $ENV_FILE."

      - name: Ensure Hosting sites exist (create 'sigo' if missing)
        if: steps.pre.outputs.ready == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # O site 'sigo' precisa existir no Firebase para o multi-hosting
          # funcionar. Tentamos criar best-effort — se já existir, ignoramos.
          # Se o deploy falhar mais tarde porque o site não foi criado, as
          # instruções estão no README.
          CREATE_ARGS="hosting:sites:create sigo --project protagonista-rpg --non-interactive"
          if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] && [ -n "$FIREBASE_TOKEN" ]; then
            CREATE_ARGS="$CREATE_ARGS --token $FIREBASE_TOKEN"
          fi
          set +e
          npx firebase $CREATE_ARGS 2>&1 | tee /tmp/site-create.log
          CREATE_EXIT=$?
          set -e
          if grep -qiE "already exists|already_exists" /tmp/site-create.log; then
            echo "✓ Site 'sigo' já existe — ok"
          elif [ $CREATE_EXIT -eq 0 ]; then
            echo "✓ Site 'sigo' criado com sucesso"
          else
            echo "::warning::Não foi possível criar o site 'sigo' automaticamente."
            echo "Para criar manualmente: firebase hosting:sites:create sigo"
            echo "O deploy pode falhar se o site 'sigo' não existir — mas o site"
            echo "'consultascao' (com redirect 301) será deployado normalmente."
          fi

      - name: Deploy to Firebase (hosting + functions + firestore)
        if: steps.pre.outputs.ready == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -e
          ARGS="deploy --only hosting,functions,firestore --project protagonista-rpg --non-interactive"
          if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] && [ -n "$FIREBASE_TOKEN" ]; then
            ARGS="$ARGS --token $FIREBASE_TOKEN"
          fi
          npx firebase $ARGS
