name: Deploy to Firebase

# Deploy automático para o Firebase a cada push no `main` (após um merge) e
# também sob demanda (workflow_dispatch).
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   Autenticação (um dos dois):
#     - FIREBASE_SERVICE_ACCOUNT  → JSON de uma conta de serviço com permissão de
#                                   deploy (Firebase Admin + Cloud Functions Admin
#                                   + Service Account User). Recomendado.
#     - FIREBASE_TOKEN            → token gerado por `firebase login:ci`.
#   Configuração do frontend (sem elas o app publicado não conecta ao Firebase):
#     - VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#       VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID,
#       VITE_FIREBASE_APP_ID
#     - (opcionais) VITE_CONSULTAS_CAO_APP_ID, VITE_CONSULTAS_CAO_FUNCTIONS_VERSION,
#       VITE_CONSULTAS_CAO_APP_BASE_URL
#   Configuração das Cloud Functions (opcionais — sem eles as respectivas
#   funcionalidades ficam graciosamente inativas, nada quebra):
#     - EMAIL_API_KEY        → chave da API do Resend (e-mail transacional: 2FA,
#                               resumo diário e relatório semanal por e-mail).
#     - PLATFORM_ADMIN_EMAILS → e-mails (separados por vírgula) com acesso de
#                               super-admin garantido, mesmo sem registro no Firestore.
#     - BILLING_BQ_PROJECT, BILLING_BQ_DATASET, BILLING_BQ_TABLE → export do
#                               Cloud Billing para o BigQuery (custos reais na aba Admin).
#   Passo a passo completo de cada um: app → Administração & Custos → aba Configuração.
#
# Enquanto os secrets de deploy não existirem, o job termina VERDE sem publicar
# nada (passo "Check deploy secrets"), evitando publicar um app quebrado.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check deploy secrets
        id: pre
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          if { [ -n "$SA" ] || [ -n "$TOKEN" ]; } && [ -n "$API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Secrets de deploy presentes — prosseguindo."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy pulado::Configure FIREBASE_SERVICE_ACCOUNT (ou FIREBASE_TOKEN) e as variáveis VITE_FIREBASE_* nos secrets do repositório para habilitar o deploy automático."
          fi

      - name: Setup Node.js
        if: steps.pre.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions-v2/package-lock.json

      - name: Install frontend dependencies
        if: steps.pre.outputs.ready == 'true'
        run: npm ci

      - name: Install functions dependencies
        if: steps.pre.outputs.ready == 'true'
        run: npm --prefix functions-v2 ci

      - name: Build functions
        if: steps.pre.outputs.ready == 'true'
        run: npm --prefix functions-v2 run build:local

      - name: Build frontend
        if: steps.pre.outputs.ready == 'true'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_CONSULTAS_CAO_APP_ID: ${{ secrets.VITE_CONSULTAS_CAO_APP_ID }}
          VITE_CONSULTAS_CAO_FUNCTIONS_VERSION: ${{ secrets.VITE_CONSULTAS_CAO_FUNCTIONS_VERSION }}
          VITE_CONSULTAS_CAO_APP_BASE_URL: ${{ secrets.VITE_CONSULTAS_CAO_APP_BASE_URL }}

      - name: Authenticate (service account)
        if: steps.pre.outputs.ready == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then
            printf '%s' "$SA" > "${RUNNER_TEMP}/firebase-sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/firebase-sa.json" >> "$GITHUB_ENV"
            echo "Autenticando via conta de serviço."
          else
            echo "Sem conta de serviço; usando FIREBASE_TOKEN."
          fi

      - name: Write functions runtime config (.env)
        if: steps.pre.outputs.ready == 'true'
        env:
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          PLATFORM_ADMIN_EMAILS: ${{ secrets.PLATFORM_ADMIN_EMAILS }}
          BILLING_BQ_PROJECT: ${{ secrets.BILLING_BQ_PROJECT }}
          BILLING_BQ_DATASET: ${{ secrets.BILLING_BQ_DATASET }}
          BILLING_BQ_TABLE: ${{ secrets.BILLING_BQ_TABLE }}
        run: |
          # functions-v2/.env é git-ignorado — nunca commitado. Cada secret
          # opcional configurado no GitHub vira uma variável de ambiente da
          # Cloud Function neste deploy; os que não existirem simplesmente
          # não entram no arquivo (a função correspondente já lida bem com a
          # ausência). Ver instruções completas em Admin → Configuração.
          ENV_FILE="functions-v2/.env"
          : > "$ENV_FILE"
          [ -n "$EMAIL_API_KEY" ] && printf 'EMAIL_API_KEY=%s\n' "$EMAIL_API_KEY" >> "$ENV_FILE"
          [ -n "$PLATFORM_ADMIN_EMAILS" ] && printf 'PLATFORM_ADMIN_EMAILS=%s\n' "$PLATFORM_ADMIN_EMAILS" >> "$ENV_FILE"
          [ -n "$BILLING_BQ_PROJECT" ] && printf 'BILLING_BQ_PROJECT=%s\n' "$BILLING_BQ_PROJECT" >> "$ENV_FILE"
          [ -n "$BILLING_BQ_DATASET" ] && printf 'BILLING_BQ_DATASET=%s\n' "$BILLING_BQ_DATASET" >> "$ENV_FILE"
          [ -n "$BILLING_BQ_TABLE" ] && printf 'BILLING_BQ_TABLE=%s\n' "$BILLING_BQ_TABLE" >> "$ENV_FILE"
          echo "$(wc -l < "$ENV_FILE") variável(is) de ambiente escrita(s) em $ENV_FILE."

      - name: Ensure Hosting sites exist (create 'sigo' if missing)
        if: steps.pre.outputs.ready == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # O site 'sigo' pode estar reservado por outro projeto Firebase (os
          # site IDs são globais). Tentamos nesta ordem:
          #   1. 'sigo'            → preferido, mas pode estar reservado
          #   2. 'sigo-caocipp'    → fallback 1
          #   3. 'sigo-mp-rs'      → fallback 2
          #   4. 'sigo-protagonista' → fallback 3
          # O domínio 'sigo.web.app' pode ser custom domain em qualquer site
          # (não precisa ser o ID do site).

          TRY_NAMES=("sigo" "sigo-caocipp" "sigo-mp-rs" "sigo-protagonista")
          CREATED_SITE=""

          for SITE_NAME in "${TRY_NAMES[@]}"; do
            echo "→ Tentando criar site: $SITE_NAME"
            CREATE_ARGS="hosting:sites:create $SITE_NAME --project protagonista-rpg --non-interactive"
            if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] && [ -n "$FIREBASE_TOKEN" ]; then
              CREATE_ARGS="$CREATE_ARGS --token $FIREBASE_TOKEN"
            fi
            set +e
            OUT=$(npx firebase $CREATE_ARGS 2>&1)
            CREATE_EXIT=$?
            set -e
            if echo "$OUT" | grep -qiE "already exists|already_exists"; then
              echo "✓ Site '$SITE_NAME' já existe — usando este"
              CREATED_SITE="$SITE_NAME"
              break
            elif [ $CREATE_EXIT -eq 0 ]; then
              echo "✓ Site '$SITE_NAME' criado com sucesso"
              CREATED_SITE="$SITE_NAME"
              break
            elif echo "$OUT" | grep -qiE "reserved by another project"; then
              echo "✗ '$SITE_NAME' reservado por outro projeto — tentando próximo"
              continue
            else
              echo "✗ Falha ao criar '$SITE_NAME':"
              echo "$OUT" | head -5
              continue
            fi
          done

          if [ -z "$CREATED_SITE" ]; then
            echo "::error::Nenhum dos nomes de site candidatos pôde ser criado."
            echo "Veja o log acima para detalhes. Você pode:"
            echo "  1. Tentar criar manualmente: firebase hosting:sites:create <nome>"
            echo "  2. Adicionar o nome criado em firebase.json (campo 'site' do array hosting)"
            exit 1
          fi

          if [ "$CREATED_SITE" != "sigo" ]; then
            echo "::warning::Site criado com nome '$CREATED_SITE' (nao 'sigo' que esta reservado)"
            echo "Atualizando firebase.json para usar '$CREATED_SITE' como site ID."
            # Atualiza dinamicamente o firebase.json via script Node.
            CREATED_SITE="$CREATED_SITE" node .github/scripts/update-firebase-site.cjs
            echo "AVISO IMPORTANTE: este site ID '$CREATED_SITE' precisa virar o custom"
            echo "   domain 'sigo.web.app' manualmente no Firebase Console:"
            echo "   Hosting -> site $CREATED_SITE -> Add custom domain -> sigo.web.app"
          fi

      - name: Deploy to Firebase (hosting + functions + firestore)
        if: steps.pre.outputs.ready == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -e
          # Limpeza preventiva: se a Cloud Function 'checkPartnershipNoticeDeadlines'
          # estiver órfã no projeto (ex.: deploy anterior criou a função mas o
          # job do Cloud Scheduler falhou), o deploy subsequente recusa prosseguir
          # com a exclusão automática. Removemos manualmente para destravar.
          # Idempotente: falha silenciosa se a função não existir.
          set +e
          DEL_ARGS="functions:delete checkPartnershipNoticeDeadlines --region southamerica-east1 --project protagonista-rpg --force --non-interactive"
          if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] && [ -n "$FIREBASE_TOKEN" ]; then
            DEL_ARGS="$DEL_ARGS --token $FIREBASE_TOKEN"
          fi
          OUT=$(npx firebase $DEL_ARGS 2>&1)
          DEL_EXIT=$?
          set -e
          if [ $DEL_EXIT -eq 0 ]; then
            echo "✓ checkPartnershipNoticeDeadlines removida (estava órfã)."
            # O cache do Firebase pode demorar 60-120s para propagar a remoção.
            # Loop de verificação: tenta de novo até 4x com espera crescente.
            for i in 1 2 3 4; do
              WAIT=$((i * 30))
              echo "  Tentativa $i: aguardando ${WAIT}s..."
              sleep $WAIT
              set +e
              LIST_OUT=$(npx firebase functions:list --region southamerica-east1 --project protagonista-rpg 2>&1)
              LIST_EXIT=$?
              set -e
              if echo "$LIST_OUT" | grep -q "checkPartnershipNoticeDeadlines"; then
                echo "  Função ainda visível no cache. Aguardando mais..."
                continue
              fi
              echo "  Cache propagado — função não aparece mais."
              break
            done
          elif echo "$OUT" | grep -qiE "not found|not_found|NOT_FOUND"; then
            echo "✓ checkPartnershipNoticeDeadlines não existe — nada a remover."
          else
            echo "::warning::Falha ao tentar remover função órfã (prosseguindo):"
            echo "$OUT" | head -5
          fi
          ARGS="deploy --only hosting,functions,firestore --project protagonista-rpg --non-interactive"
          if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] && [ -n "$FIREBASE_TOKEN" ]; then
            ARGS="$ARGS --token $FIREBASE_TOKEN"
          fi
          npx firebase $ARGS
